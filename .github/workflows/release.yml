name: Tipsy Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:

  release:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore
      run: dotnet restore Tipsy.slnx --locked-mode

    - name: Build
      run: dotnet build Tipsy.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test Tipsy.Core.Tests --configuration Release --no-build

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Tipsy/bin/x64/Release/Tipsy/latest.zip
          Tipsy/bin/x64/Release/Tipsy/Tipsy.json
        fail_on_unmatched_files: true
